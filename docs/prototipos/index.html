<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mãos em Ação · Protótipos</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f3;font:15px 'Segoe UI',sans-serif;color:#213a31}header{padding:32px 5%;background:#175c48;color:#fff}h1{margin:0 0 12px;font-size:30px}header p{margin:0;color:#dce7c3}nav{display:flex;gap:8px;flex-wrap:wrap;padding:20px 5%;position:sticky;top:0;background:#f7f8f3;border-bottom:1px solid #dae3d5}button{background:white;border:1px solid #ccd8c6;color:#175c48;border-radius:8px;padding:10px 15px;cursor:pointer}button.active{background:#175c48;color:white}main{padding:25px 5%}img{max-width:100%;height:auto;border:1px solid #d9e2d3;border-radius:12px;box-shadow:0 12px 40px #163c3112}p{line-height:1.6}#screen{scroll-margin-top:150px}</style><header><h1>✳ Mãos em Ação</h1><p>Protótipos de alta fidelidade · capturas da interface Angular executável</p></header><nav aria-label="Selecionar tela"></nav><main><h2 id="title">Visão geral</h2><p id="description">Uma visão do impacto da rede de solidariedade.</p><img id="screen" src="dashboard.png" alt="Protótipo da visão geral"><p>Para executar formulários e testar os fluxos, inicie a aplicação seguindo FUNCIONALIDADES_E_TESTES.md. Esta galeria apresenta telas estáticas.</p></main><script>const screens=[['Visão geral','dashboard','Uma visão do impacto da rede de solidariedade.'],['Acesso','login','Entrada e convite para participar da comunidade.'],['Campanhas','campanhas','Campanhas, metas e transições de estado.'],['Nova campanha','nova-campanha','Formulário para iniciar uma ação solidária.'],['Estoque','estoque','Saldo e histórico de movimentações.'],['Voluntariado','voluntariado','Agenda, vagas e participações.'],['Entregas','entregas','Distribuição e correção com estorno.'],['Pessoas','pessoas','Aprovação e horas dedicadas.'],['Relatórios','relatorios','Balanços salvos para prestação de contas.'],['Notificações','notificacoes','Mudanças importantes para a participação.'],['Mobile','mobile','Interface adaptada a uma tela estreita.']];for(const [name,file,desc] of screens){const b=document.createElement('button');b.textContent=name;b.className=file==='dashboard'?'active':'';b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.className='');b.className='active';document.querySelector('#screen').src=file+'.png';document.querySelector('#screen').alt='Protótipo: '+name;document.querySelector('#title').textContent=name;document.querySelector('#description').textContent=desc;};document.querySelector('nav').append(b);}</script></html>
