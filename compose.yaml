services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: maos
      POSTGRES_USER: maos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maos -d maos"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/maos
      DB_USER: maos
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@maosemacao.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD com ao menos 12 caracteres}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
