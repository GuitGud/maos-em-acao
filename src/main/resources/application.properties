spring.application.name=maos-em-acao
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/maos;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
app.admin.email=${ADMIN_EMAIL:admin@maosemacao.local}
app.admin.password=${ADMIN_PASSWORD:}
app.demo=${DEMO_MODE:false}
